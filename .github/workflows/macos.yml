# The macOS builds of MudPilot: the same compiled, no-source build as Windows and Linux (build_exe/build.py, Nuitka),
# made on GitHub's macOS machines — Apple Silicon and Intel — each zip checked with --selftest before it's kept.
#
# Run it from the Actions tab (Run workflow): "ref" is the source to build (a tag, branch or commit; its
# mudpilot/__init__.py version names the zip) and "release" is the GitHub release to attach the zips to (e.g.
# v0.8.224.2; leave it blank to only build — the zips are kept on the run's page for a week).
name: macOS build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source to build (tag, branch or commit)"
        default: main
        required: true
      release:
        description: "Release tag to attach the Mac zips to (blank = build only)"
        default: ""
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon (M1+)
            arch: arm64
          - runner: macos-15-intel    # Intel Macs
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"   # runs on macOS 11 (Big Sur) and newer
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python has Tk
        run: python -c "import tkinter, sys, platform; print(sys.version, platform.machine(), 'tk', tkinter.TkVersion)"

      - name: Source knows the Mac program name
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          # the compiled program is MudPilot.bin on a Mac (a Mac disk sees "MudPilot" and mudpilot/ as one name);
          # launcher.py and config.py must look for that name too, or the install won't open
          # (a build-only run of older source is a warning, so the build itself can still be tried)
          if ! grep -q 'MudPilot.bin' mudpilot/launcher.py || ! grep -q 'MudPilot.bin' mudpilot/config.py; then
            if [ -n "$RELEASE" ]; then
              echo "::error::this source predates the Mac build (no MudPilot.bin in launcher.py/config.py)"; exit 1
            fi
            echo "::warning::this source predates the Mac build: the zip would build but not open"
          fi

      - name: Report address (runner copy only)
        env:
          REPORT_ENDPOINT: ${{ secrets.REPORT_ENDPOINT }}
        run: |
          # Help -> Report a problem sends to the developer's private channel, as the Windows/Linux builds do. The
          # address is the repo secret REPORT_ENDPOINT; it's written into this runner's checkout only (never
          # committed, never printed). No secret (a fork) = the file stays blank and reports are saved locally.
          f=mudpilot/report_endpoint.txt
          {
            printf '%s\n' '# Developer bug-report address (Discord webhook URL, https://discord.com/api/webhooks/...).'
            printf '%s\n' '# Put it on the first non-# line. Blank = reports are only saved locally.'
            if [ -n "$REPORT_ENDPOINT" ]; then printf '%s\n' "$REPORT_ENDPOINT"; fi
          } > "$f"
          if [ -n "$REPORT_ENDPOINT" ]; then echo "report address: set"; else echo "report address: none (reports stay local)"; fi

      - name: Build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka ordered-set zstandard -r requirements.txt

      - name: Build
        run: python build_exe/build.py

      - name: Unzip and selftest
        run: |
          set -e
          zip=$(ls dist/MudPilot-*-mac-${{ matrix.arch }}.zip)
          echo "ZIP=$zip" >> "$GITHUB_ENV"
          rm -rf t && mkdir t && cd t && unzip -q "../$zip"
          ver=$(ls MudPilot/app)
          test -x MudPilot/MudPilot && test -x "MudPilot/app/$ver/MudPilot.bin"
          file "MudPilot/app/$ver/MudPilot.bin"
          codesign -dv "MudPilot/app/$ver/MudPilot.bin" 2>&1 | head -5 || true
          echo "minimum macOS:"; otool -l "MudPilot/app/$ver/MudPilot.bin" | grep -A3 LC_BUILD_VERSION | grep minos || true
          if find MudPilot -path '*mudpilot*' \( -name '*.py' -o -name '*.pyc' \) | grep -q .; then
            echo "source in the build"; exit 1
          fi
          "MudPilot/app/$ver/MudPilot.bin" --selftest selftest.txt || { cat selftest.txt; exit 1; }
          cat selftest.txt
          grep -qx "ALL OK" selftest.txt

      - name: Opens like a player opens it
        run: |
          # the top MudPilot starter -> launcher -> MudPilot window, as a double-click does; still running 45 s later
          cd t
          ./MudPilot/MudPilot > launch.log 2>&1 &
          sleep 45
          ps -axo pid,command | grep '[M]udPilot.bin' || true
          ok=0
          ps -axo command | grep -q '[M]udPilot.bin -m mudpilot.launcher' || { echo "::error::the launcher isn't running"; ok=1; }
          ps -axo command | grep -Eq '[M]udPilot.bin -m mudpilot( |$)' || { echo "::error::the MudPilot window didn't open"; ok=1; }
          test -d MudPilot/data || { echo "::error::no data folder was made"; ok=1; }
          echo "--- launch.log"; cat launch.log || true
          echo "--- data/"; ls -R MudPilot/data 2>/dev/null | head -40 || true
          pkill -f '[M]udPilot.bin' || true
          exit $ok

      - uses: actions/upload-artifact@v5
        with:
          name: mac-${{ matrix.arch }}
          path: ${{ env.ZIP }}
          retention-days: 7
          if-no-files-found: error

  attach:
    needs: build
    if: ${{ inputs.release != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: zips
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          ls -la zips
          want="${TAG#v}"
          for z in zips/*.zip; do
            case "$(basename "$z")" in MudPilot-"$want"-mac-*.zip) ;; *) echo "$z isn't version $want"; exit 1 ;; esac
          done
          gh release upload "$TAG" zips/*.zip --clobber --repo "$GITHUB_REPOSITORY"
