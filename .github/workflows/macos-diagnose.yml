# Opens a published Mac download on GitHub's Mac like a player does, and keeps what happened: screenshots over the
# first two minutes, MudPilot's logs, and a stack sample of each MudPilot process (where it's stuck, if it is).
name: macOS diagnose

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag whose Mac zip to open"
        default: v0.8.224.4
        required: true
      arch:
        description: "arm64 or x64"
        default: arm64
        required: true
      patch:
        description: "From-source run: try the start-up hang fix (.github/mac_update_fix.py) first"
        type: boolean
        default: false
      newchar:
        description: "Only the new-character test (from source: Character -> New character..., and the launcher's)"
        type: boolean
        default: false
      compiled_newchar:
        description: "Only: open the release's Mac zip and click Character -> New character... (as a player)"
        type: boolean
        default: false
      dialog:
        description: "Only: tkinter's name box vs a plain one, real clicks and typing"
        type: boolean
        default: false
      appbox:
        description: "Only: MudPilot's New character box with real clicks/typing, pieces switched off one at a time"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ !inputs.newchar && !inputs.compiled_newchar && !inputs.dialog && !inputs.appbox }}
    runs-on: ${{ inputs.arch == 'x64' && 'macos-15-intel' || 'macos-15' }}
    steps:
      - name: Download
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
          ARCH: ${{ inputs.arch }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*-mac-$ARCH.zip"
          mkdir t && cd t && unzip -q ../*.zip && ls MudPilot MudPilot/app

      - name: Open and watch
        run: |
          mkdir -p out
          cd t
          ./MudPilot/MudPilot > ../out/launch.log 2>&1 &
          for s in 5 15 30 60 120; do
            sleep $(( s - ${prev:-0} )); prev=$s
            screencapture -x "../out/shot-${s}s.png" || true
            echo "== ${s}s"; ps -axo pid,%cpu,stat,command | grep '[M]udPilot.bin' || true
          done
          for p in $(pgrep -f 'MudPilot.bin -m mudpilot'); do
            sample "$p" 5 -file "../out/sample-$p.txt" >/dev/null 2>&1 || true
            ps -o pid,command -p "$p" >> ../out/samples-index.txt
          done
          cp -R MudPilot/data ../out/data 2>/dev/null || true
          find ../out/data -name '*.db' -delete 2>/dev/null || true
          pkill -f '[M]udPilot.bin' || true
          tail -60 ../out/data/logs/*.log 2>/dev/null || true
          tail -40 ../out/data/control/launcher.log 2>/dev/null || true

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: diagnose-${{ inputs.arch }}
          path: out
          retention-days: 7

  # From source: counts every Python callback Tk runs (and what's happening in the event loop) while it's stuck
  from-source:
    if: ${{ !inputs.newchar && !inputs.compiled_newchar && !inputs.dialog && !inputs.appbox }}
    runs-on: ${{ inputs.arch == 'x64' && 'macos-15-intel' || 'macos-15' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run with Tk callback counting
        run: |
          python -m pip install -q -r requirements.txt
          if [ "${{ inputs.patch }}" = "true" ]; then python .github/mac_update_fix.py .; fi
          mkdir -p out diag
          cat > diag/tkcount.py <<'PY'
          import collections, os, sys, threading, time, tkinter, traceback
          counts = collections.Counter(); recent = collections.deque(maxlen=40); t0 = time.time()
          orig = tkinter.CallWrapper.__call__
          def call(self, *args):
              f = self.func
              if getattr(f, "__qualname__", "").endswith("callit") and f.__closure__:
                  inner = [c.cell_contents for c in f.__closure__ if callable(c.cell_contents)]
                  if inner:
                      f = inner[0]
              name = getattr(f, "__qualname__", repr(f))
              code = getattr(f, "__code__", None)
              if code is not None:
                  name += f" ({os.path.basename(code.co_filename)}:{code.co_firstlineno})"
              counts[name] += 1
              recent.append(f"{time.time() - t0:7.2f} {name}")
              return orig(self, *args)
          tkinter.CallWrapper.__call__ = call
          def dump():
              while True:
                  time.sleep(10)
                  NL = chr(10)
                  with open("out/tkcount.txt", "a") as fh:
                      fh.write(f"=== {time.time() - t0:.0f}s" + NL)
                      for k, v in counts.most_common(25):
                          fh.write(f"{v:8d} {k}" + NL)
                      fh.write("--- last calls" + NL + NL.join(recent) + NL)
                      fr = sys._current_frames()[threading.main_thread().ident]
                      fh.write("--- main thread now" + NL + "".join(traceback.format_stack(fr)) + NL)
          threading.Thread(target=dump, daemon=True).start()
          PY
          (PYTHONPATH=diag python -c "import tkcount, runpy, sys; sys.argv=['mudpilot']; runpy.run_module('mudpilot', run_name='__main__')" > out/run.log 2>&1 &)
          sleep 75
          screencapture -x out/shot.png || true
          pkill -f "runpy.run_module" || true
          tail -80 out/tkcount.txt || true
          tail -20 out/run.log || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: from-source-${{ inputs.arch }}
          path: out
          retention-days: 7

  # Making a new character, as a player does it (0.8.226.1 on a Mac: beachball when making a new character)
  newchar:
    if: ${{ inputs.newchar }}
    runs-on: ${{ inputs.arch == 'x64' && 'macos-15-intel' || 'macos-15' }}
    strategy:
      fail-fast: false
      matrix:
        mode: [app, picker]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: New character (${{ matrix.mode }})
        run: |
          python -m pip install -q -r requirements.txt
          mkdir -p out
          (python -I .github/mac_newchar_probe.py ${{ matrix.mode }} > out/run.log 2>&1 &)
          for s in 10 25 32 40 60; do
            sleep $(( s - ${prev:-0} )); prev=$s
            screencapture -x "out/shot-${s}s.png" || true
          done
          pid=$(pgrep -f mac_newchar_probe | head -1)
          [ -n "$pid" ] && sample "$pid" 3 -file out/sample.txt >/dev/null 2>&1 || true
          pkill -f mac_newchar_probe || true
          echo "--- probe.log"; cat out/probe.log || true
          echo "--- last stack"; tail -30 out/stacks.txt || true
          echo "--- run.log"; tail -30 out/run.log || true
          grep -q DONE out/probe.log || { echo "::error::making a new character didn't finish"; exit 1; }
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: newchar-${{ matrix.mode }}-${{ inputs.arch }}
          path: out
          retention-days: 7

  # The compiled download (and the same source), driven with the real Mac menu bar, mouse and keyboard:
  # does typing reach the main window? the New character box? after clicking into it? does OK work?
  compiled-newchar:
    if: ${{ inputs.compiled_newchar }}
    runs-on: ${{ inputs.arch == 'x64' && 'macos-15-intel' || 'macos-15' }}
    strategy:
      fail-fast: false
      matrix:
        build: [compiled, source]
    steps:
      - uses: actions/checkout@v5
        if: matrix.build == 'source'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        if: matrix.build == 'source'
        with:
          python-version: "3.12"
      - name: Get it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
          ARCH: ${{ inputs.arch }}
        run: |
          if [ "${{ matrix.build }}" = compiled ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*-mac-$ARCH.zip"
            mkdir t && cd t && unzip -q ../*.zip
          else
            python -m pip install -q -r requirements.txt
            if [ "${{ inputs.patch }}" = "true" ]; then python .github/mac_update_fix.py .; fi
          fi
      - name: Open, type, New character...
        run: |
          mkdir -p out
          if [ "${{ matrix.build }}" = compiled ]; then
            (cd t && ./MudPilot/MudPilot > ../out/launch.log 2>&1 &); pat='MudPilot.bin -m mudpilot$'; DATA=t/MudPilot/data
          else
            (python -m mudpilot > out/launch.log 2>&1 &); pat='[Pp]ython.* -m mudpilot$'; DATA=data
          fi
          brew install -q cliclick >/dev/null 2>&1 || true
          sleep 40
          app=$(pgrep -f "$pat" | head -1); echo "app pid $app"
          shot() { screencapture -x "out/$1.png" || true; sample "$app" 2 -file "out/sample-$1.txt" >/dev/null 2>&1 || true; }
          se() { osascript -e "tell application \"System Events\" to $1" 2>&1 | tee -a out/osa.log || true; }
          se "tell (first process whose unix id is $app) to set frontmost to true"
          shot a-open
          cliclick c:152,210 || true; sleep 3; shot b-board-answered        # Paradigm, on the board question
          cliclick c:336,645 w:500 t:hello || true; sleep 2; shot c-typed-main   # the command line
          se "tell (first process whose unix id is $app) to click menu item \"New character…\" of menu \"Character\" of menu bar item \"Character\" of menu bar 1"
          sleep 4; shot d-box
          cliclick t:Typed || true; sleep 2; shot e-typed-box
          cliclick c:502,391 w:500 t:Clicked || true; sleep 2; shot f-clicked-typed
          cliclick c:433,430 || true; sleep 6; shot g-ok
          ps -o pid,%cpu,stat,command -p "$app" || echo "app process gone"
          for f in out/sample-*.txt; do echo "== $f"; grep -oE '(new_profile|Tk_TkwaitObjCmd|Tkapp_MainLoop|Tk_UpdateObjCmd|switch_profile)' "$f" | sort | uniq -c; done
          cp -R "$DATA" out/data 2>/dev/null || true
          find out/data -name '*.db' -delete 2>/dev/null || true
          pkill -f "$pat" || true; pkill -f '[M]udPilot.bin' || true
          echo "--- log"; tail -25 out/data/logs/*.log 2>/dev/null || true
          ls out/data/profiles 2>/dev/null || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: compiled-newchar-${{ matrix.build }}-${{ inputs.arch }}
          path: out
          retention-days: 7

  # tkinter's simpledialog name box vs a plain Toplevel one: real mouse/keyboard (cliclick), does the name get through?
  dialog:
    if: ${{ inputs.dialog }}
    runs-on: ${{ inputs.arch == 'x64' && 'macos-15-intel' || 'macos-15' }}
    strategy:
      fail-fast: false
      matrix:
        mode: [bare, custom, menu, menudefer]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Box (${{ matrix.mode }})
        run: |
          brew install -q cliclick >/dev/null 2>&1 || true
          mkdir -p out
          (python -I .github/mac_dialog_probe.py ${{ matrix.mode }} > out/run.log 2>&1 &)
          if case "${{ matrix.mode }}" in menu*) true;; *) false;; esac; then
            for i in $(seq 1 20); do grep -q "menu ready" out/probe.log 2>/dev/null && break; sleep 1; done; sleep 2
            pid=$(pgrep -f mac_dialog_probe | head -1)
            # a real click on the menu bar, then on the item (as a hand does)
            osascript -e "tell application \"System Events\" to tell (first process whose unix id is $pid) to set frontmost to true" || true
            pos=$(osascript -e "tell application \"System Events\" to tell (first process whose unix id is $pid) to get position of menu bar item \"Character\" of menu bar 1" | tr -d ' ')
            echo "Character menu at $pos"; mx=${pos%,*}; my=${pos#*,}
            cliclick c:$((mx+20)),$((my+10)) w:700 || true
            ipos=$(osascript -e "tell application \"System Events\" to tell (first process whose unix id is $pid) to get position of menu item 1 of menu 1 of menu bar item \"Character\" of menu bar 1" | tr -d ' ')
            echo "item at $ipos"; cliclick c:$((${ipos%,*}+30)),$((${ipos#*,}+8)) || true
          fi
          for i in $(seq 1 30); do [ -s out/coords.txt ] && break; sleep 1; done
          read ex ey ox oy < out/coords.txt || true; echo "entry $ex,$ey OK $ox,$oy"
          screencapture -x out/a-box.png || true
          cliclick c:$ex,$ey w:500 t:Hello || true; sleep 2; screencapture -x out/b-typed.png || true
          cliclick c:$ox,$oy || true; sleep 4; screencapture -x out/c-ok.png || true
          pkill -f mac_dialog_probe || true
          cat out/probe.log; cat out/run.log
          grep -q "RESULT 'Hello'" out/probe.log || { echo "::error::the ${{ matrix.mode }} box didn't take the name"; exit 1; }
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: dialog-${{ matrix.mode }}-${{ inputs.arch }}
          path: out
          retention-days: 7

  # MudPilot's own New character box (from source), real mouse/keyboard; which piece of MudPilot stops it taking input?
  appbox:
    if: ${{ inputs.appbox }}
    runs-on: ${{ inputs.arch == 'x64' && 'macos-15-intel' || 'macos-15' }}
    strategy:
      fail-fast: false
      matrix:
        off: ["", "uilog", "keys", "loop", "uilog,keys,loop,hangwatch"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: New character box (off ${{ matrix.off }})
        env:
          MP_OFF: ${{ matrix.off }}
        run: |
          brew install -q cliclick >/dev/null 2>&1 || true
          python -m pip install -q -r requirements.txt
          mkdir -p out
          (python -I .github/mac_app_probe.py > out/run.log 2>&1 &)
          for i in $(seq 1 60); do [ -s out/coords.txt ] && break; sleep 1; done
          read ex ey ox oy < out/coords.txt || true; echo "entry $ex,$ey OK $ox,$oy"
          screencapture -x out/a-box.png || true
          cliclick c:$ex,$ey w:500 t:Hello || true; sleep 2; screencapture -x out/b-typed.png || true
          cliclick c:$ox,$oy || true; sleep 4; screencapture -x out/c-ok.png || true
          pkill -f mac_app_probe || true
          cat out/probe.log; tail -15 out/run.log
          grep -q "profile now Hello" out/probe.log || { echo "::error::the box didn't take the name (off: $MP_OFF)"; exit 1; }
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: appbox-${{ strategy.job-index }}-${{ inputs.arch }}
          path: out
          retention-days: 7
